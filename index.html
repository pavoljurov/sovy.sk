<!doctype html>
<html lang="sk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#FFF6E9" />
    <title>sovy.sk — Buďte múdri ako sovy!</title>
    <meta name="description" content="Súbor edukatívnych minihier pre všetky zvedavé deti. Hádanky, počty, hodiny a ešte viac — hraj sa, objavuj a trénuj hlavičku!" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="app"></div>
    <script>
      // Diagnostic banner for old/unusual browsers (e.g. touch-screen TVs): shows the error and
      // the browser version on screen. Plain ES5 on purpose: it must run even where the app can't.
      (function () {
        var shown = false;
        function show(detail) {
          if (shown || !document.body) return;
          shown = true;
          var box = document.createElement('div');
          box.setAttribute('style', 'position:fixed;left:0;right:0;bottom:0;z-index:9999;padding:12px 16px;' +
            'background:#2B2440;color:#fff;font:16px/1.4 sans-serif;white-space:pre-wrap;word-break:break-word');
          box.textContent = 'Hra sa nespustila správne. / The app did not start correctly.\n' +
            detail + '\n' + navigator.userAgent;
          document.body.appendChild(box);
        }
        window.addEventListener('error', function (e) {
          var t = e.target;
          if (t && t !== window && t.tagName) {
            // Only scripts matter; a missing font (offline) or image must not raise the banner.
            if (t.tagName === 'SCRIPT') show('Súbor sa nenačítal / Failed to load: ' + t.src);
          } else show((e.message || 'Error') + (e.filename ? ' @ ' + e.filename + ':' + e.lineno : ''));
        }, true);
        window.addEventListener('unhandledrejection', function (e) {
          show('Promise: ' + (e.reason && e.reason.message ? e.reason.message : String(e.reason)));
        });
        window.addEventListener('load', function () {
          setTimeout(function () {
            var app = document.getElementById('app');
            if (app && !app.firstChild) {
              show(location.protocol === 'file:'
                ? 'Spustite cez webový server, nie zo súboru. / Open it via a web server, not as a file (file://).'
                : 'Prehliadač je pravdepodobne príliš starý. / The browser is probably too old.');
            }
          }, 3000);
        });
      })();
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
